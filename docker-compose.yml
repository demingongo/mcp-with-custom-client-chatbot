services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MCP_BASE_URL=http://mcp-server:3001
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:latest}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      mcp-server:
        condition: service_started
      ollama:
        condition: service_healthy
  mcp-server:
    container_name: mcp-server
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    # list models to check if the server is healthy
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./.docker-compose/ollama/data:/root/.ollama
    # ollama doesn't have a built-in way to run a model on startup,
    # so we use the entrypoint to start the server and then run the model
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5 && ollama run ${OLLAMA_MODEL:-gemma4:latest} && wait"
